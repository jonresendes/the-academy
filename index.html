<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#2c3a8f">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="The Academy">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <title>The Academy · Learn Hub</title>
  <meta name="description" content="A learning environment with study rooms, tests, games and a display case of achievements.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Lexend:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <button class="back-btn" id="backBtn" type="button" title="Back" aria-label="Back" hidden>← <span class="back-label">Back</span></button>
    <a href="#/" class="brand"><img src="logo.png" alt="The Academy — Learn Hub" class="brand-logo"></a>
    <nav class="topnav">
      <a href="#/" data-nav="home">Courses</a>
      <a href="#/case" data-nav="case">Display Case</a>
      <a href="#/dashboard" data-nav="dashboard" hidden>Dashboard</a>
      <a href="#/settings" data-nav="settings">Settings</a>
    </nav>
    <div id="whoChip" class="who-chip"></div>
    <button class="btn sm accent install-btn" id="installBtn" hidden>⬇️ Install app</button>
  </header>

  <main id="app" class="app"></main>

  <div id="toasts" class="toasts" aria-live="polite"></div>

  <!-- ===== COURSES ===== -->
  <!-- Add one <script> line per course file. Order here is the order on the home page. -->
  <script src="english.js"></script>
  <script src="science.js"></script>
  <script src="olc4o.js"></script>
  <script src="colouring.js"></script>  <!-- line-art pictures for the Colouring Page -->
  <script src="hrf3o.js"></script>      <!-- HRF3O World Religions (4 units) — must load after colouring.js: it adds its own colouring pictures -->

  <!-- ===== APP ===== -->
  <script src="storage.js"></script>
  <script src="util.js"></script>
  <script src="badges.js"></script>
  <script src="games.js"></script>
  <script src="print.js"></script>
  <script src="media.js"></script>
  <script src="drive.js"></script>
  <script src="dashboard.js"></script>
  <script src="app.js"></script>
  <script src="pwa.js"></script>
</body>
</html>
