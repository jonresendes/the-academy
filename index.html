<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- Only this site's own scripts may run (plus Google sign-in for the optional Drive export): injected markup cannot execute. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://accounts.google.com https://apis.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' data: blob: https:; connect-src 'self' https://*.googleapis.com https://accounts.google.com; frame-src 'self' blob: https://docs.google.com https://drive.google.com https://www.youtube-nocookie.com https://www.youtube.com https://accounts.google.com; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#2c3a8f">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="The Academy">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <title>The Academy · Learn Hub</title>
  <meta name="description" content="A learning environment with study rooms, tests, games and a display case of achievements.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Lexend:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <button class="back-btn" id="backBtn" type="button" title="Back" aria-label="Back" hidden>← <span class="back-label">Back</span></button>
    <a href="#/" class="brand"><img src="logo.png" alt="The Academy — Learn Hub" class="brand-logo"></a>
    <nav class="topnav">
      <a href="#/" data-nav="home">Student Desk</a>
      <a href="#/sections" data-nav="sections">Sections</a>
      <a href="#/teachers" data-nav="teachers" hidden>Teachers</a>
      <a href="#/case" data-nav="case">Display Case</a>
      <a href="#/settings" data-nav="settings">Settings</a>
    </nav>
    <div id="whoChip" class="who-chip"></div>
    <button class="btn sm accent install-btn" id="installBtn" hidden>⬇️ Install app</button>
  </header>

  <main id="app" class="app"></main>

  <div id="toasts" class="toasts" aria-live="polite"></div>

  <!-- ===== COURSES ===== -->
  <!-- Add one <script> line per course file. Order here is the order on the home page. -->
  <script src="english.js"></script>
  <script src="science.js"></script>
  <script src="olc4o.js"></script>
  <script src="colouring.js"></script>  <!-- line-art pictures for the Colouring Page -->
  <script src="hrf3o.js"></script>      <!-- HRF3O World Religions (4 units) — must load after colouring.js: it adds its own colouring pictures -->
  <script src="snc1l2l.js"></script>    <!-- SNC1L/2L Science, Locally Developed — loads after colouring.js -->
  <script src="glc2o.js"></script>      <!-- GLC2O Career Studies (5 units) — loads after colouring.js -->
  <script src="eng3u.js"></script>

  <!-- ===== CLOUD (Firebase) — accounts and live sync; set enabled:false in cloud-config.js for device-only mode ===== -->
  <!-- Firebase SDK 10.14.1, served from this site (copied from the official npm package) so no outside script is trusted. -->
  <script src="firebase-app-compat.js"></script>
  <script src="firebase-auth-compat.js"></script>
  <script src="firebase-firestore-compat.js"></script>
  <script src="cloud-config.js"></script>
  <script src="cloud.js"></script>

  <!-- ===== APP ===== -->
  <script src="storage.js"></script>
  <script src="util.js"></script>
  <script src="badges.js"></script>
  <script src="games.js"></script>
  <script src="print.js"></script>
  <script src="media.js"></script>
  <script src="drive.js"></script>
  <script src="overlay.js"></script>
  <script src="dashboard.js"></script>
  <script src="app.js"></script>
  <script src="pwa.js"></script>
  <script src="report.js"></script>   <!-- "Found a problem?" button; loads html2canvas.min.js only when it is pressed -->
</body>
</html>
